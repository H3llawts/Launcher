##################################### Pancake 32MB (ESP32-C5 N32R8 + 3.5" ST7796) ####################################################
[env:pancake-32MB]
board = esp32c5
board_build.partitions = support_files/custom_32Mb.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
build_src_filter = ${env.build_src_filter} +<../boards/pancake-32MB>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

	-DDEVICE_NAME='"Pancake 32MB"'
	-DOTA_TAG='"pancake-32MB"'

	-DROTATION=0

	; TFT — ST7796 3.5" 320x480, shared SPI bus with SD card
	-DHAS_TOUCH=1

	-D TFT_DATABUS_N=0        # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=2  # Arduino_ST7796
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DTFT_INVERSION_ON=1
	-DTFT_MISO=4
	-DTFT_MOSI=24
	-DTFT_SCLK=23
	-DTFT_CS=5
	-DTFT_DC=3
	-DTFT_RST=2
	-DTFT_BL=26
	-DTOUCH_CS=-1
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0

	; Backlight PWM
	-DDIMMER_SETUP=60

	; SD card — shares SPI bus with TFT
	-DSDCARD_CS=7
	-DSDCARD_SCK=TFT_SCLK
	-DSDCARD_MISO=TFT_MISO
	-DSDCARD_MOSI=TFT_MOSI

lib_ignore =
	SensorLib
	XPowersLib
